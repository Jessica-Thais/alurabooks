<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alurabooks</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;1,700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- SUPERVISIONADO POR KIUSKY -->
<header class="cabecalho">
    <div class="container">
        <input type="checkbox" id="menu" class="container__botao">
        <label for="menu">
            <span class="cabecalho__menu-hamburguer conteiner__imagem"></span>
        </label>
        <ul class="lista-menu">
            <li class="lista-menu__titulo">Categorias</li>
            <li class="lista-menu__item">
                <a href="#" class="lista-menu__link">Programação</a>
            </li>
            <li class="lista-menu__item">
                <a href="#" class="lista-menu__link">Front-and</a>
            </li>
            <li class="lista-menu__item">
                <a href="#" class="lista-menu__link">Infraestrutura</a>
            </li>
            <li class="lista-menu__item">
                <a href="#" class="lista-menu__link">Busines</a>
            </li>
            <li class="lista-menu__item">
                <a href="#" class="lista-menu__link">Design & UX</a>
            </li>
        </ul>
        <img src="img/Logo.svg" alt="Logo da Alurabooks">
    </div>
    <div class="container">
        <a href="#"><img src="img/Favoritos.svg" alt="Meus Favoritos" class="conteiner__imagem"></a>
        <a href="#"><img src="img/Sacola.svg" alt="Carrinho de Compras" class="conteiner__imagem"></a>
        <a href="#"><img src="img/Usuario.svg" alt="Meu Perfil" class="conteiner__imagem"></a>
    </div>
</header>
<section class="banner">
    <h2 class="banner__titulo">Já sabe por onde começar?</h2>
    <p class="banner__texto">Encontre em nossa estante o que precisa para seu desenvolvimento!</p>
    <input type="search" class="banner__pesquisa" placeholder="Qual será sua próxima leitura?">
</section>
<section class="carrossel">
    <h2 class="carrossel__titulo">Novos lançamentos</h2>
    <!-- Slider main container -->
    <div class="swiper">
         <!-- If we need pagination -->
      <div class="swiper-pagination"></div>

      <!-- Additional required wrapper -->
      <div class="swiper-wrapper">
        <!-- Slides -->
        <div class="swiper-slide"><img src="img/Angular.svg" alt="livro sobre Angular do Alurabooks"></div>
        <div class="swiper-slide"><img src="img/ApacheKafka.svg" alt="livro sobre ApacheKafka do Alurabooks"></div>
        <div class="swiper-slide"><img src="img/Arquitetura.svg" alt="livro sobre Arquitetura do Alurabooks"></div>
        <div class="swiper-slide"><img src="img/Construct2.svg" alt="livro sobre Construct2 da Alurabooks"></div>
        <div class="swiper-slide"><img src="img/Guia Front-end.svg" alt="livro sobre Guia Front-and"></div>
        <div class="swiper-slide"><img src="img/Javascript.svg" alt="livro sobre Javascript"></div>
        <div class="swiper-slide"><img src="img/Portugol.svg" alt="livro sobre Portugol"></div>
    </div>
      <!-- If we need pagination -->
      <div class="swiper-pagination"></div>
      
      <!-- If we need navigation buttons -->
      <div class="swiper-button-prev"></div>
      <div class="swiper-button-next"></div>

    </div> <!-- O fechamento da div .swiper deve ser aqui -->
</section>

<script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
<script>
    const swiper = new Swiper('.swiper', {
      spaceBetween: 10,
       slidesPerView: 3,
       pagination: {
            el: '.swiper-pagination',
            type: 'bullets',
        },    
    });
</script>
</body>
</html>
